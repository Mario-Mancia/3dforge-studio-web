{% if is_paginated %}
<nav class="paginacion">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if bajo %}&bajo=1{% endif %}{% if estado %}&estado={{ estado|urlencode }}{% endif %}">Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if bajo %}&bajo=1{% endif %}{% if estado %}&estado={{ estado|urlencode }}{% endif %}">Siguiente</a>{% endif %}
</nav>
{% endif %}
