{% extends "layouts/dashboard.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar</button>
  <a href="{{ volver }}">Cancelar</a>
</form>
{% endblock %}
