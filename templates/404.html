{% load static %}<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem("tema");
        if (!tema) { tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
        document.documentElement.setAttribute("data-bs-theme", tema);
      } catch (error) {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    })();
  </script>
  <title>Página no encontrada</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
  <main class="container pagina-error contenido-animado">
    <div class="card auth-tarjeta">
      <div class="card-body p-4 p-md-5">
        <span class="material-symbols-rounded icono-xl">search_off</span>
        <p class="text-body-secondary mb-0">Error 404</p>
        <h1 class="display-6 mt-2">Página no encontrada</h1>
        <p class="lead text-body-secondary">La dirección no existe o fue movida.</p>
        <a class="btn btn-primary" href="/"><span class="material-symbols-rounded">home</span>Volver al inicio</a>
      </div>
    </div>
  </main>
</body>
</html>
